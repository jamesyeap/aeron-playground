plugins {
    id 'com.gradleup.shadow'
}

apply from: "${rootDir}/gradle/sbe.gradle"

// Fat jar: build/libs/subscriber-<version>-all.jar
tasks.named('shadowJar') {
    manifest {
        attributes 'Main-Class': 'subscriber.Subscriber'
    }
}

dependencies {
    implementation 'org.springframework.shell:spring-shell-core:4.0.2'
}
