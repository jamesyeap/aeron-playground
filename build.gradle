plugins {
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

group = 'org.jamesyeap'
version = '1.0-SNAPSHOT'

subprojects {
    apply plugin: 'java'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    dependencies {
        // Aeron
        implementation 'io.aeron:aeron-all:1.51.0'

        // SLF4J facade with Log4j2 backend
        implementation 'org.slf4j:slf4j-api:2.0.13'
        implementation 'org.slf4j:log4j-over-slf4j:2.0.18'
        runtimeOnly 'org.apache.logging.log4j:log4j-api:2.23.1'
        runtimeOnly 'org.apache.logging.log4j:log4j-core:2.23.1'
        runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1'

        // Testing
        testImplementation platform('org.junit:junit-bom:6.0.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'io.aeron:aeron-agent:1.51.0'
    }

    test {
        useJUnitPlatform()
    }
}
